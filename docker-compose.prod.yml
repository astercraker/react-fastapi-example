services:
  backend:
    volumes: !reset []
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  frontend:
    build:
      target: prod
    image: react-fastapi-example-frontend:prod
    ports: !override
      - "80:80"
    volumes: !reset []
    restart: unless-stopped
